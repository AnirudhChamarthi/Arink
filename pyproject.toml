[project]
name = "riskbot"
version = "2.0.0.dev0"
description = "Verifiable risk analysis: pure math core, variation sets, traces, REST, MCP and web UI."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "arch>=7.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["riskbot*"]

[tool.pytest.ini_options]
testpaths = ["riskbot"]
addopts = "-q --import-mode=importlib"
