      tags: [Risk]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portfolio]
              properties:
                portfolio:          { $ref: '#/components/schemas/EnrichedPortfolio' }
                exclusion_filters:  { type: array, items: { type: string }, default: [] }
                include_carbon_var: { type: boolean, default: true }
                carbon_price_shock: { type: number, format: double, default: 50.0,
                                      description: "Carbon price increase in $/tCO2e" }
                run_exclusion_check: { type: boolean, default: true }
      responses:
        '200':
          description: Sustainability analysis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SustainabilityResult' }

